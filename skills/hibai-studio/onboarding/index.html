<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HibAI Studio</title>
<meta name="description" content="HibAI Studio — جاوب على أسئلة بالزربة باش نقاد ليك الفيديو بالطريقة اللي بغيتي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;700;900&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700;900&family=Readex+Pro:wght@400;700&family=Almarai:wght@400;700;800&family=Lalezar&family=Changa:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* The dashboard wears HibAI colours. The user's video colours are separate (--p-*). */
:root{
  --ground:#0d0f14; --lime:#8eff01; --purple:#8b53fe;
  --text:#f4f6f8; --muted:#9aa3b2; --line:rgba(255,255,255,.09); --card:rgba(20,24,34,.74); --field:rgba(13,15,20,.6);
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif; --serif:"Instrument Serif",Georgia,serif;
  --p-bg:#101828; --p-ink:#F5F7FA; --p-acc:#F2B33D; --p-on:#101828; --p-font:'Cairo';
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--text);font-family:var(--ar)}
body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}

.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;background:var(--lime);top:2%;left:-6%;opacity:.32}
.aurora i:nth-child(2){width:52vw;height:52vw;background:var(--purple);top:-8%;right:-10%;opacity:.55;animation-duration:30s}
.aurora i:nth-child(3){width:40vw;height:40vw;background:#12a84a;bottom:-12%;right:18%;opacity:.32;animation-duration:34s}
.aurora i:nth-child(4){width:38vw;height:38vw;background:var(--purple);bottom:-10%;left:-8%;opacity:.4;animation-duration:26s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(13,15,20,.85) 100%)}

header,main,footer,.bar{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(16px,4vw,40px)}
.mark{font-family:var(--serif);font-style:italic;font-size:30px;direction:ltr;line-height:1}
.mark b{font-weight:400;color:var(--lime);text-shadow:0 0 18px rgba(142,255,1,.55)}
.mark span{color:var(--purple);text-shadow:0 0 18px rgba(139,83,254,.6)}
.mark small{font-family:var(--ar);font-style:normal;font-size:12px;color:var(--muted);letter-spacing:3px;margin-inline-start:10px;text-transform:uppercase}
.count{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;direction:ltr}
.count b{color:var(--lime);font-weight:400}
.bar{height:2px;background:var(--line);margin:0 clamp(16px,4vw,40px)}
.bar i{display:block;height:100%;width:0;background:var(--lime);box-shadow:0 0 12px var(--lime);transition:width .35s ease}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px 40px}
.card{width:100%;max-width:700px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,40px);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.dr{font-size:clamp(24px,4.6vw,32px);font-weight:800;line-height:1.35;margin:0}
.en{font-family:var(--serif);font-style:italic;font-size:clamp(19px,3.4vw,23px);color:var(--muted);direction:ltr;text-align:right;margin:6px 0 0}
.help{color:var(--muted);font-size:15px;margin:14px 0 0;line-height:1.6}
.help i{display:block;direction:ltr;text-align:right;font-family:var(--serif);font-size:16px;opacity:.85}
.field{margin-top:24px}
.sub{font-weight:700;font-size:15px;margin:22px 0 10px;color:var(--text)}
.sub i{font-family:var(--serif);font-weight:400;color:var(--muted);margin-inline-start:6px}

/* welcome */
.welcome{text-align:center}
.welcome .hello{font-weight:900;font-size:clamp(38px,8vw,58px);line-height:1.25;margin:0}
.welcome .hello em{font-style:normal;color:var(--lime);text-shadow:0 0 24px rgba(142,255,1,.45)}
.welcome .big-mark{font-family:var(--serif);font-style:italic;font-size:clamp(52px,12vw,92px);direction:ltr;margin:8px 0 4px;line-height:1}
.welcome .big-mark b{font-weight:400;color:var(--lime);text-shadow:0 0 30px rgba(142,255,1,.6)}
.welcome .big-mark span{color:var(--purple);text-shadow:0 0 30px rgba(139,83,254,.7)}
.welcome .studio{letter-spacing:8px;font-size:13px;color:var(--muted);text-transform:uppercase;direction:ltr}
.welcome .lead{font-size:19px;line-height:1.7;margin:24px auto 0;max-width:480px}
.welcome .lead-en{font-family:var(--serif);font-style:italic;color:var(--muted);direction:ltr;font-size:19px;margin:6px auto 0;max-width:480px}
.by{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:7px 16px 7px 8px;border:1px solid var(--line);border-radius:99px;direction:ltr}
.by img{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--lime);object-fit:cover}
.by span{font-size:13px;color:var(--muted)} .by b{color:var(--lime);letter-spacing:1px}

/* inputs */
input[type=text],input[type=url],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  font:500 17px var(--ar);outline:none;transition:border .2s,box-shadow .2s}
textarea{min-height:120px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(142,255,1,.15)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opts.wide{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opts.chips{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;border:1px solid var(--line);background:var(--field);border-radius:16px;padding:14px;cursor:pointer;text-align:center;
  transition:border .15s,transform .15s,background .15s}
.chips .opt{border-radius:99px;padding:9px 18px}
.opt:hover{border-color:rgba(142,255,1,.45);transform:translateY(-2px)}
.opt.on{border-color:var(--lime);background:rgba(142,255,1,.08);box-shadow:0 0 0 1px var(--lime) inset}
.opt .l1{font-weight:700;font-size:16px;display:block}
.opt .l2{color:var(--muted);font-size:13px;display:block;margin-top:3px;line-height:1.45}
.opt:focus-visible,.btn:focus-visible,.toggle:focus-visible,.tab:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

/* palettes */
.pal{padding:8px}
.pal .mini{height:76px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:9px;text-align:right}
.pal .mini b{font-size:15px;font-family:Cairo}
.pal .mini em{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:5px}
.pal .l1{font-size:13px;margin-top:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:600}
.tab.on{border-color:var(--lime);background:rgba(142,255,1,.08)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:var(--field)}
.sw input{width:100%;height:50px;border:none;border-radius:10px;background:none;cursor:pointer;padding:0}
.sw span{display:block;font-weight:700;font-size:14px;margin-top:6px}
.warn{margin:12px 0 0;font-size:13px;color:#ffcf7a;background:rgba(255,190,60,.1);border-radius:10px;padding:8px 12px}
.live{margin-top:18px;border-radius:14px;padding:18px;text-align:center;font:800 22px var(--p-font),Cairo;background:var(--p-bg);color:var(--p-ink)}
.live em{font-style:normal;background:var(--p-acc);color:var(--p-on);padding:0 8px;border-radius:6px}

/* logo drop */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:190px;border:1.5px dashed rgba(255,255,255,.18);
  border-radius:18px;background:var(--field);cursor:pointer;padding:20px;text-align:center;transition:border .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--lime);background:rgba(142,255,1,.05)}
.drop img{max-width:170px;max-height:110px;object-fit:contain;margin-bottom:10px;border-radius:8px;
  background:repeating-conic-gradient(#222 0 25%,#2c2c2c 0 50%) 0 0/16px 16px}
.drop .plus{font-size:40px;color:var(--lime);line-height:1;margin-bottom:6px}

/* font + caption previews (in the user's colours) */
.fontc .s{display:block;font-size:22px;line-height:1.4;margin-bottom:6px}
.phone{display:block;aspect-ratio:9/12;border-radius:10px;overflow:hidden;position:relative;margin-bottom:10px;
  background:radial-gradient(60% 42% at 50% 36%,rgba(255,255,255,.16),transparent 70%),linear-gradient(160deg,#3a3f4d,#1b1f29)}
.phone .person{position:absolute;left:50%;top:18%;width:34%;aspect-ratio:1;border-radius:50%;background:#4a5163;transform:translateX(-50%)}
.phone .person::after{content:"";position:absolute;left:50%;top:105%;width:190%;height:130%;border-radius:50% 50% 0 0;background:#4a5163;transform:translateX(-50%)}
.phone .cap{position:absolute;left:6%;right:6%;bottom:12%;font:800 13px var(--p-font),Cairo;color:#fff;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;direction:rtl}
.phone .cap .w{padding:1px 3px;border-radius:4px;transition:all .15s}
.cap-card .cap{background:var(--p-bg);color:var(--p-ink);border-radius:8px;padding:5px}
.cap-card .w.a{background:var(--p-acc);color:var(--p-on)}
.cap-shadow .cap{text-shadow:0 2px 6px rgba(0,0,0,.9);font-size:15px}
.cap-shadow .w.a{color:var(--p-acc)}
.cap-big .w{display:none}.cap-big .w.a{display:inline;font-size:22px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.cap-underline .w.a{box-shadow:inset 0 -4px 0 var(--p-acc)}
.cap-bar .w.a{background:var(--p-acc);color:var(--p-on)}
.cap-type .w{opacity:0}.cap-type .w.p,.cap-type .w.a{opacity:1}

/* pace bars */
.stage{display:flex;gap:3px;height:36px;align-items:flex-end;justify-content:center;margin-bottom:10px}
.stage b{width:6px;background:var(--p-acc);border-radius:3px;opacity:.85}

/* toggle */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:16px;padding:16px 20px;cursor:pointer;background:var(--field);width:100%}
.switch{width:56px;height:32px;border-radius:99px;background:#2a3040;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.toggle.on .switch{background:var(--lime)} .toggle.on .switch::after{right:28px;background:var(--ground)}
.toggle .state{font-weight:700;font-size:17px}
.stack{display:grid;gap:12px;margin-top:14px}
.stack small{color:var(--muted);font-size:13px;display:block;margin-bottom:6px}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:30px;gap:10px;flex-wrap:wrap}
.nav .left{display:flex;gap:10px;align-items:center}
.btn{border:none;border-radius:99px;padding:14px 28px;font:800 16px var(--ar);cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.go{background:var(--lime);color:var(--ground);box-shadow:0 8px 30px rgba(142,255,1,.25)}
.btn.go:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(142,255,1,.35)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--text)}
.btn .sub2{font-family:var(--serif);font-style:italic;font-weight:400;opacity:.75}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;direction:ltr}
.hint kbd{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}

/* summary + done */
.sum{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.sum li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.sum .k{color:var(--muted);font-size:13px}.sum .v{font-weight:700;overflow-wrap:anywhere}
.sum .v i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin:0 2px}
.sum button{background:none;border:none;color:var(--lime);cursor:pointer;font:600 13px var(--ar)}
.done{text-align:center}
.done .tick{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:rgba(142,255,1,.12);border:1px solid var(--lime);color:var(--lime);font-size:38px;box-shadow:0 0 40px rgba(142,255,1,.25)}
pre{direction:ltr;text-align:left;background:var(--field);border-radius:12px;padding:12px;font-size:12px;max-height:260px;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d2331;border:1px solid var(--line);padding:10px 18px;border-radius:12px;opacity:0;transition:all .25s;z-index:5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px 26px;color:var(--muted);font-size:13px;direction:ltr;flex-wrap:wrap}
footer img{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--lime);object-fit:cover}
footer b{color:var(--lime);letter-spacing:1.5px}
footer .dot{opacity:.4}
footer a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--purple)}
footer a:hover{color:var(--lime);border-color:var(--lime)}
@media (max-width:520px){.swatches{grid-template-columns:1fr}.btn{padding:13px 20px}.mark small{display:none}}
</style>
</head>

<script>

const FONTS=[

const CAPS=[

  {v:'card',n:'كارط',d:'كارط باللون ديالك والكلمة كتتلوّن'},{v:'shadow',n:'ظل',d:'أبيض كبير بلا خلفية'},
  {v:'big',n:'كلمة بكلمة',d:'كلمة وحدة كبيرة'},{v:'underline',n:'خط تحت',d:'خط باللون ديالك تحت الكلمة'},
  {v:'bar',n:'شريط',d:'شريط باللون ديالك ورا الكلمة'},{v:'type',n:'كتابة',d:'كتكتب قدامك'},
];

  {v:'hyper',n:'صاروخ',d:'شي حاجة كتتحرك كل نص ثانية — هوك وترند',seg:16},

const PLATS=[{v:'instagram',n:'إنستغرام'},{v:'tiktok',n:'تيك توك'},{v:'shorts',n:'يوتيوب شورتس'},{v:'snapchat',n:'سناب'},
  {v:'youtube',n:'يوتيوب'},{v:'x',n:'X'},{v:'linkedin',n:'لينكدإن'}];
const LENS=[{v:'auto',n:'أوتوماتيك'},{v:'30',n:'قل من 30 ث'},{v:'60',n:'دقيقة'},{v:'90',n:'دقيقة ونص'},{v:'full',n:'كيف ما هو'}];
const BGS=[{v:'auto',n:'نقرّرو من بعد'},{v:'none',n:'بلا'},{v:'own',n:'عندي ملف'}];
const SFXS=[{v:'auto',n:'أوتوماتيك'},{v:'on',n:'شعّلها'},{v:'off',n:'بلاها'}];
const SERVER=location.protocol.startsWith('http');

/* ═══ Answers (same shape the engine reads) ═══ */
const A={note:'', idMode:'auto', palette:null, custom:{bg:'#111827',ink:'#F9FAFB',acc:'#22C55E'}, url:'', logo:null, logoSaved:false,
  font:'auto', capStyle:'auto', digits:'western', pace:'auto', ctype:'auto', orientation:['9:16'], platforms:[], length:'auto',
  bgAudio:'auto', sfx:'auto', endOn:false, handle:'', cta:'', word:'', movesOn:false};

/* ═══ Helpers ═══ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function toHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function lum(h){return hx(h).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}).reduce((s,v,i)=>s+v*[0.2126,0.7152,0.0722][i],0);}
function contrast(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function onColor(acc,ink,bg){ /* same rule as on_accent in 00_onboard.py */
  const best=[ink,bg].reduce((b,c)=>contrast(c,acc)>contrast(b,acc)?c:b);
  if(contrast(best,acc)>=4.5) return best;
  return [ink,bg,'#FFFFFF','#111111'].reduce((b,c)=>contrast(c,acc)>contrast(b,acc)?c:b); }
function mix(a,b,k){const P=hx(a),Q=hx(b);return toHex(P.map((v,i)=>v+(Q[i]-v)*k));}
function colors(){
  if(A.idMode==='custom'){const B=A.custom.bg.toUpperCase(),I=A.custom.ink.toUpperCase(),C=A.custom.acc.toUpperCase();
    return {bg:B,ink:I,acc:C,clay:mix(C,'#000000',0.22),mut:mix(B,I,0.55)};}
  const p=PALETTES.find(x=>x.id===A.palette); return p&&A.idMode==='palette'?{bg:p.bg,ink:p.ink,acc:p.acc,clay:p.clay,mut:p.mut}:null;
}
function applyPreview(){
  const c=colors()||PALETTES[0], r=document.documentElement.style;
  r.setProperty('--p-bg',c.bg); r.setProperty('--p-ink',c.ink); r.setProperty('--p-acc',c.acc); r.setProperty('--p-on',onColor(c.acc,c.ink,c.bg));
  r.setProperty('--p-font',A.font!=='auto'?`'${A.font}'`:"'Cairo'");
}
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
const choice=(list,key,cls='')=>`<div class="opts ${cls}">${list.map(o=>`<button type="button" class="opt ${A[key]===o.v?'on':''}" data-k="${key}" data-v="${esc(o.v)}"><span class="l1">${esc(o.n)}</span>${o.d?`<span class="l2">${esc(o.d)}</span>`:''}</button>`).join('')}</div>`;
const multi=(list,key,cls='')=>`<div class="opts ${cls}">${list.map(o=>`<button type="button" class="opt ${A[key].includes(o.v)?'on':''}" data-m="${key}" data-v="${esc(o.v)}"><span class="l1">${esc(o.n)}</span>${o.d?`<span class="l2">${esc(o.d)}</span>`:''}</button>`).join('')}</div>`;
const capWords=()=>CAP_WORDS.map((w,i)=>`<span class="w${i===0?' a':''}">${w}</span>`).join('');

/* ═══ Steps — one per screen ═══
   To add a question: add a block here (group = what "answered" records), a key in A, and send it in collect(). */
const STEPS=[
 {group:null, dr:'كتب شنو بغيتي', en:'Tell me what you want', help:'بغيتي تختصر؟ كتب هنا وضغط «دوز الأسئلة». ولا كمّل جاوب.<i>In a hurry? Write here and skip the rest, or keep going.</i>',
  body:()=>`<textarea id="note" dir="auto" placeholder="مثلا: إعلان للمحل ديالي، ألوان اللوغو أحمر وأبيض، إيقاع سريع، وفالآخر «حجز دابا»">${esc(A.note)}</textarea>

 {group:'identity', dr:'ألوان البراند ديالك', en:'Your brand colours', help:'الكروت والكتابة كاملين كياخدو هاد الألوان. الصورة ديالك ما كتبدّلش.<i>Cards and text use these colours. Your face is never recoloured.</i>',
  body:()=>`<div class="tabs">${[['palette','ألوان واجدة'],['custom','نختارها براسي'],['url','من السيت ولا الحساب ديالي']].map(([m,n])=>`<button type="button" class="tab ${A.idMode===m||(A.idMode==='auto'&&m==='palette')?'on':''}" data-tab="${m}">${n}</button>`).join('')}</div>
   ${A.idMode==='custom'?`<div class="swatches">${[['bg','الخلفية'],['ink','الكتابة'],['acc','الكلمة المهمة']].map(([k,n])=>`<label class="sw"><input type="color" data-c="${k}" value="${A.custom[k].toLowerCase()}"><span>${n}</span></label>`).join('')}</div>
      <p class="warn" id="cwarn" hidden>اللون قريب بزاف من الخلفية — الكلمة ما غاديش تبان مزيان. جرّب لون كحل ولا فاتح كثر.</p>`

    : `<div class="opts">${PALETTES.map(p=>`<button type="button" class="opt pal ${A.palette===p.id&&A.idMode==='palette'?'on':''}" data-pal="${p.id}"><span class="mini" style="background:${p.bg};color:${p.ink}"><b>مرحبا بيك</b><em style="background:${p.acc};color:${onColor(p.acc,p.ink,p.bg)}">جديد</em></span><span class="l1">${p.n}</span></button>`).join('')}</div>`}
   ${A.idMode!=='url'?`<div class="live">كتعلم <em>AI</em> معايا</div>`:''}`},
 {group:'identity', dr:'زيد اللوغو ولا شي صورة', en:'Add your logo or an image', help:'PNG بلا خلفية كيجي أحسن. اختياري.<i>A PNG with no background looks best. Optional.</i>',
  body:()=>{const src=A.logo?A.logo.data:(A.logoSaved?'/api/logo':''); return `<label class="drop" id="drop"><input type="file" id="logoIn" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
   ${src?`<img src="${src}" alt="">`:`<span class="plus">+</span>`}<span style="font-weight:700">${src?'بدّل الصورة':'ضغط ولا جرّ الصورة هنا'}</span><span style="color:var(--muted);font-family:var(--serif);font-style:italic;direction:ltr">${src?'Change image':'Click or drop an image here'}</span></label>`;}},
 {group:'font', dr:'الخط', en:'Font', help:'كاملين كيدعمو العربية. ختار اللي كيشبه ليك.<i>All support Arabic. Pick the one that feels like you.</i>',
  body:()=>`<div class="opts wide">${FONTS.map(f=>`<button type="button" class="opt fontc ${A.font===f.v?'on':''}" data-k="font" data-v="${esc(f.v)}">${f.v==='auto'?'':`<span class="s" style="font-family:'${f.v}';font-weight:${f.v==='Lalezar'?400:700}">${FONT_SAMPLE}</span>`}<span class="l1">${esc(f.n)}</span><span class="l2">${esc(f.d)}</span></button>`).join('')}</div>`},
 {group:'capStyle', dr:'شكل الكابشن', en:'Caption style', help:'الكلمة كتتلوّن فاللحظة اللي كتقولها — بالألوان والخط اللي ختاريتي.<i>The word lights up as you say it, in your colours and font.</i>',
  body:()=>`<div class="opts">${CAPS.map(c=>`<button type="button" class="opt ${A.capStyle===c.v?'on':''} cap-${c.v}" data-k="capStyle" data-v="${c.v}"><span class="phone"><span class="person"></span><span class="cap">${c.v==='auto'?'✨':capWords()}</span></span><span class="l1">${c.n}</span><span class="l2">${c.d}</span></button>`).join('')}</div>`},
 {group:'digits', dr:'الأرقام', en:'Numbers', help:'فالكابشن والرسومات.<i>In captions and graphics.</i>',
  body:()=>choice([{v:'western',n:'عادية',d:'خصم 25% على 3 قطع'},{v:'arabic',n:'مشرقية',d:'خصم ٢٥٪ على ٣ قطع'}],'digits')},
 {group:'pace', dr:'الإيقاع', en:'Pace', help:'شحال من مرة الكادر كيتحرك ويتبدّل.<i>How often the frame moves and changes.</i>',
  body:()=>`<div class="opts">${PACES.map(p=>`<button type="button" class="opt ${A.pace===p.v?'on':''}" data-k="pace" data-v="${p.v}"><span class="stage">${p.seg?Array.from({length:p.seg},(_,i)=>`<b style="height:${20+((i*37)%16)}px"></b>`).join(''):'<span style="color:var(--muted);font-size:13px">حسب الهضرة</span>'}</span><span class="l1">${p.n}</span><span class="l2">${p.d}</span></button>`).join('')}</div>`},
 {group:'content', dr:'نوع الفيديو', en:'Video type', help:'إلا ما ختاريتيش، غادي نعرفو من الفيديو براسو.<i>Skip it and I\'ll tell from the video.</i>',
  body:()=>choice(CTYPES,'ctype','chips')},
 {group:'platforms', dr:'فين غادي تنشر؟', en:'Where will you post?', help:'باش نبعّد الكتابة على البوطونات ديال كل بلاصة.<i>So text stays clear of each app\'s buttons.</i>',
  body:()=>multi(PLATS,'platforms','chips')+`<div class="sub">طول الفيديو<i>Length</i></div>`+choice(LENS,'length','chips')},
 {group:'audio', dr:'الأصوات', en:'Sound', help:'',
  body:()=>`<div class="sub" style="margin-top:0">صوت ف الخلفية<i>Background audio</i></div>${choice(BGS,'bgAudio','chips')}
   <div class="sub">مؤثرات صوتية (ووش، ضربة، نقرة)<i>Sound effects</i></div>${choice(SFXS,'sfx','chips')}`},
 {group:'endCard', dr:'كارط النهاية', en:'End card', help:'آخر ثواني ف الفيديو: الحساب ديالك وجملة كتدعي الناس يتفاعلو. اختياري.<i>Last seconds: your handle and a call to action. Optional.</i>',
  body:()=>`<button type="button" class="toggle ${A.endOn?'on':''}" id="endTg" role="switch" aria-checked="${A.endOn}"><span class="state">${A.endOn?'بغيت كارط فالآخر · Yes':'بلا كارط · No'}</span><span class="switch"></span></button>
   ${A.endOn?`<div class="stack"><label><small>الحساب ديالك</small><input type="text" id="handle" dir="ltr" value="${esc(A.handle)}" placeholder="@yourname"></label>
    <label><small>الجملة الأخيرة — قصيرة وكتبان كبيرة</small><input type="text" id="cta" maxlength="60" value="${esc(A.cta)}" placeholder="تبعني للجزء الثاني"></label>
    <label><small>كلمة يكتبوها ف الكومنت (اختياري)</small><input type="text" id="word" value="${esc(A.word)}" placeholder="CODE"></label></div>`:''}`},
 {group:'moves', dr:'الحركات', en:'Motion moves', help:'عندي بنك فيه 100 حركة. كل فيديو كنختار ليه 3 حركات أساسية + شي حركات للحظات الخاصة.<i>A bank of 100 moves. I pick a set for each video.</i>',
  body:()=>`<button type="button" class="toggle ${A.movesOn?'on':''}" id="movesTg" role="switch" aria-checked="${A.movesOn}"><span class="state">${A.movesOn?'بغيت نختار براسي · I\'ll pick':'ختار أنت · You pick'}</span><span class="switch"></span></button>
   ${A.movesOn?`<p class="help">حل البنك وضغط «بغيتها» على اللي عجباتك و«لا» على اللي ما بغيتيهاش، وسجّل تما.</p><a class="btn ghost" href="/moves/?from=onboard" target="_blank" rel="noopener">حل بنك الحركات ↗</a> <span id="movesSaved" class="help"></span>`:''}`},
];
let step=-1;   // -1 welcome · 0..n-1 steps · n summary · n+1 done

/* ═══ Render ═══ */
function chrome(){
  const n=STEPS.length;
  $('#count').innerHTML=step>=0&&step<n?`<b>${String(step+1).padStart(2,'0')}</b> / ${String(n).padStart(2,'0')}`:'';
  $('#bar').style.width=step<0?'0':Math.min(100,(step/n)*100)+'%';
}
function nav(){
  const last=step===STEPS.length-1;
  return `<div class="nav"><button type="button" class="btn go" id="next">${last?'شوف الملخص':'زيد'} <span class="sub2">${last?'review':'next'}</span></button>
    <div class="left"><button type="button" class="btn ghost" id="skip">دوز <span class="sub2">skip</span></button><button type="button" class="btn ghost" id="back">رجع</button></div></div>
    <div class="hint"><kbd>Enter</kbd> next · <kbd>Esc</kbd> back</div>`;
}
function render(){
  chrome(); applyPreview();
  const c=$('#card'); c.style.animation='none'; c.offsetHeight; c.style.animation='';
  if(step<0) return welcome();
  if(step===STEPS.length) return summary();
  if(step>STEPS.length) return;
  const s=STEPS[step];
  c.innerHTML=`<h1 class="dr">${s.dr}</h1><p class="en">${s.en}</p>${s.help?`<p class="help">${s.help}</p>`:''}<div class="field">${s.body()}</div>${nav()}`;
  wire(s);
}
function welcome(){
  $('#card').innerHTML=`<div class="welcome"><h1 class="hello">مرحبا <em>بيك</em></h1><div class="big-mark"><b>Hib</b><span>AI</span></div><div class="studio">Studio</div>
    <p class="lead">جاوب على أسئلة بالزربة باش نقدر نقاد ليك الفيديو بالطريقة اللي بغيتي.</p>
    <p class="lead-en">Answer a few quick questions so I can edit your video exactly the way you want.</p>
    <div class="nav" style="justify-content:center"><button type="button" class="btn go" id="next">يلاه نبداو <span class="sub2">let's go</span></button></div>
    <div class="by"><img src="assets/pfp.png" alt="" onerror="this.remove()"><span>Welcome to the HibAI community · by</span><b>@hibssssi</b></div></div>`;
  $('#next').onclick=()=>go(1); $('#next').focus();
}
function mark(g){ if(g) touched.add(g); }
function wire(s){
  $('#next').onclick=()=>{ commitText(); go(1); };
  $('#skip').onclick=()=>{ commitText(); go(1); };
  $('#back').onclick=()=>{ commitText(); go(-1); };
  $$('[data-k]').forEach(b=>b.onclick=()=>{
    A[b.dataset.k]=b.dataset.v; mark(s.group);
    if(b.dataset.k==='font') return render();
    $$(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('on',x===b)); applyPreview();
  });
  $$('[data-m]').forEach(b=>b.onclick=()=>{
    const arr=A[b.dataset.m], i=arr.indexOf(b.dataset.v);
    if(i>=0) arr.splice(i,1); else arr.push(b.dataset.v); mark(s.group); b.classList.toggle('on',i<0);
  });
  $$('[data-tab]').forEach(t=>t.onclick=()=>{ commitText(); A.idMode=t.dataset.tab; if(A.idMode!=='palette') mark('identity'); render(); });
  $$('[data-pal]').forEach(b=>b.onclick=()=>{ A.idMode='palette'; A.palette=b.dataset.pal; mark('identity'); render(); });
  $$('[data-c]').forEach(inp=>inp.addEventListener('input',()=>{ A.custom[inp.dataset.c]=inp.value; mark('identity'); applyPreview();
    const c=colors(), w=$('#cwarn'); if(w) w.hidden=!(contrast(c.acc,c.bg)<1.8||contrast(onColor(c.acc,c.ink,c.bg),c.acc)<3); }));
  const li=$('#logoIn');
  if(li){ const take=f=>{ if(!f) return; if(f.size>6*1024*1024){ toast('الصورة كبيرة — قل من 6 ميغا عافاك'); return; }
      const rd=new FileReader(); rd.onload=()=>{ A.logo={name:f.name,data:rd.result}; mark('identity'); render(); }; rd.readAsDataURL(f); };
    li.onchange=()=>take(li.files[0]); const d=$('#drop');
    d.ondragover=e=>{e.preventDefault(); d.classList.add('over');}; d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault(); take(e.dataTransfer.files[0]);}; }
  const et=$('#endTg'); if(et) et.onclick=()=>{ commitText(); A.endOn=!A.endOn; mark('endCard'); render(); };
  const mt=$('#movesTg'); if(mt) mt.onclick=()=>{ A.movesOn=!A.movesOn; mark('moves'); render(); };
  const sa=$('#skipAll'); if(sa) sa.onclick=()=>{ commitText(); send({version:1,skip:true,note:A.note}); };
  if($('#movesSaved')) movesState();
  const first=$('#card textarea, #card input[type=text], #card input[type=url]'); if(first) first.focus({preventScroll:true});
}
function commitText(){
  const g=id=>{const e=document.getElementById(id); return e?e.value:null;};
  if(g('note')!==null) A.note=g('note');
  if(g('url')!==null){ A.url=g('url').trim(); if(A.url) mark('identity'); }
  ['handle','cta','word'].forEach(k=>{ if(g(k)!==null){ A[k]=g(k).trim(); if(A[k]) mark('endCard'); } });
}
function go(d){ step=Math.max(-1,Math.min(STEPS.length,step+d)); render(); window.scrollTo({top:0,behavior:'smooth'}); }

async function movesState(){ try{ const st=await (await fetch('/api/state')).json(); const m=st.moves||{}; const a=(m.on||[]).length,b=(m.off||[]).length;
  const el=$('#movesSaved'); if(el&&(a||b)) el.textContent=`مسجّل: بغيت ${a} · لا ${b}`; }catch(e){} }
window.addEventListener('focus',()=>{ if($('#movesSaved')) movesState(); });

/* ═══ Summary + save (same payload as before → 00_onboard.py) ═══ */
function collect(){
  let identity={mode:'auto'};
  const c=colors();
  if(A.idMode==='palette'&&A.palette) identity={mode:'palette',palette:A.palette,colors:c};
  else if(A.idMode==='custom') identity={mode:'custom',colors:c};
  else if(A.idMode==='url'&&A.url) identity={mode:'url',url:A.url};
  if(A.logo) identity.logo=A.logo;
  return {version:1, skip:false, note:A.note.trim(), identity,
    font:A.font, capStyle:A.capStyle, digits:A.digits, pace:A.pace,
    content:{type:A.ctype,person:'with'},
    orientation:['9:16'], platforms:A.platforms, length:A.length,
    voice:{mode:'own', lang:null, gender:null, tts:null},
    bgAudio:A.bgAudio, sfx:A.sfx,
    endCard:{on:A.endOn, handle:A.handle, cta:A.cta, word:A.word},
    answered:[...touched]};
}
const nameOf=(list,v)=>{const o=list.find(x=>x.v===v); return o?o.n:v;};
function summary(){
  const c=colors(), pal=PALETTES.find(p=>p.id===A.palette);
  const rows=[
    ['كتب شنو بغيتي',esc(A.note)||'—',0],
    ['الألوان',A.idMode==='url'?esc(A.url||'—'):c?`${['bg','ink','acc'].map(k=>`<i style="background:${c[k]}"></i>`).join('')} ${A.idMode==='palette'&&pal?pal.n:'ديالي'}`:'أوتوماتيك',1],
    ['اللوغو',A.logo?esc(A.logo.name):(A.logoSaved?'✓':'—'),2],
    ['الخط',nameOf(FONTS,A.font),3],['الكابشن',nameOf(CAPS,A.capStyle),4],['الأرقام',A.digits==='arabic'?'مشرقية':'عادية',5],
    ['الإيقاع',nameOf(PACES,A.pace),6],['نوع الفيديو',nameOf(CTYPES,A.ctype),7],
    ['فين غادي تنشر',A.platforms.map(v=>nameOf(PLATS,v)).join(' · ')||'—',8],
    ['المؤثرات',nameOf(SFXS,A.sfx),9],['كارط النهاية',A.endOn?esc(A.handle||A.cta||'✓'):'—',10],['الحركات',A.movesOn?'براسي':'أوتوماتيك',11],
  ];
  $('#card').innerHTML=`<h1 class="dr">هادشي اللي اخترتي</h1><p class="en">Here's your brief</p>
    <ul class="sum">${rows.map(([k,v,i])=>`<li><div><div class="k">${k}</div><div class="v">${v}</div></div><button type="button" data-goto="${i}">بدّل</button></li>`).join('')}</ul>
    <div class="nav"><button type="button" class="btn go" id="save">سجّل ويلاه نبداو <span class="sub2">save</span></button><button type="button" class="btn ghost" id="back">رجع</button></div>`;
  $$('[data-goto]').forEach(b=>b.onclick=()=>{ step=+b.dataset.goto; render(); });
  $('#back').onclick=()=>go(-1); $('#save').onclick=()=>send(collect());
}
async function send(obj){
  obj.savedAt=new Date().toISOString();
  $$('#card button').forEach(b=>b.disabled=true);
  if(!SERVER) return done(obj,false);
  try{ const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'x'); done(obj,true);
  }catch(e){ $$('#card button').forEach(b=>b.disabled=false); toast('ما تسجّلش — تأكد بلي Claude باقي خدام وعاود'); }
}
function done(obj,saved){
  step=STEPS.length+1; chrome(); $('#bar').style.width='100%';
  const o={...obj}; if(o.identity&&o.identity.logo) o.identity={...o.identity,logo:'(صيفط اللوغو ف الشات)'};
  $('#card').innerHTML=`<div class="done"><div class="tick">✓</div>
    <h1 class="dr">${!saved?'نسخ هادشي وصيفطو لـ Claude':obj.skip?'واخا، خليها عليا':'تسجّل!'}</h1>
    <p class="en" style="text-align:center">${saved?'Saved, head back to Claude':'Copy this and send it to Claude'}</p>
    <p class="help" style="text-align:center">${saved?'رجع لـ Claude — الخدمة بدات. تقدر تسدّ هاد الصفحة.':'الصفحة محلولة بلا Claude، ما قدرتش نسجّل براسي.'}</p>
    ${saved?'':`<pre>${esc(JSON.stringify(o,null,2))}</pre>`}</div>`;
}

/* ═══ Keyboard ═══ */
document.addEventListener('keydown',e=>{
  if(step>=STEPS.length) return;
  if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&!e.target.closest('button')){ e.preventDefault(); commitText(); go(1); }
  if(e.key==='Escape'&&step>=0){ commitText(); go(-1); }
});

/* ═══ Prefill from a saved profile ("change my settings") ═══ */
async function prefill(){
  if(!SERVER) return;
  let p=null; try{ const r=await fetch('/api/profile'); if(r.ok) p=await r.json(); }catch(e){}
  if(!p||!p.version||p.skip) return;
  A.note=p.note||'';
  const id=p.identity||{};
  if(id.mode==='palette'&&id.palette){ A.idMode='palette'; A.palette=id.palette; }
  else if(id.mode==='custom'&&id.colors){ A.idMode='custom'; ['bg','ink','acc'].forEach(k=>{ if(id.colors[k]) A.custom[k]=id.colors[k]; }); }
  else if(id.mode==='url'&&id.url){ A.idMode='url'; A.url=id.url; }
  if(id.logo&&typeof id.logo==='string') A.logoSaved=true;
  ['font','capStyle','digits','pace','length','bgAudio','sfx'].forEach(k=>{ if(p[k]) A[k]=p[k]; });
  if(p.content&&CTYPES.some(c=>c.v===p.content.type)) A.ctype=p.content.type;
  if(Array.isArray(p.orientation)&&p.orientation.length) A.orientation=[...p.orientation];
  if(Array.isArray(p.platforms)) A.platforms=[...p.platforms];
  if(p.endCard){ A.endOn=!!p.endCard.on; A.handle=p.endCard.handle||''; A.cta=p.endCard.cta||''; A.word=p.endCard.word||''; }
  (p.answered||[]).forEach(g=>touched.add(g));
  toast('حليت الإعدادات اللي سجّلتي قبل — بدّل اللي بغيتي');
}
prefill().finally(render);
</script>
