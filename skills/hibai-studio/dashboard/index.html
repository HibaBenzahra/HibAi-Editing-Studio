<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HibAI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Instrument+Serif:ital@0;1&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0d0f14; --ground-2:#1d2331; --lime:#8eff01; --purple:#8b53fe;
  --text:#f4f6f8; --muted:#9aa3b2; --line:rgba(255,255,255,.09); --card:rgba(20,24,34,.72);
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif; --display:"Aref Ruqaa","Sakkal Majalla",serif;
  --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--text);font-family:var(--ar)}
body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* aurora */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;background:var(--lime);top:2%;left:-6%;opacity:.35}
.aurora i:nth-child(2){width:52vw;height:52vw;background:var(--purple);top:-8%;right:-10%;opacity:.55;animation-duration:28s}
.aurora i:nth-child(3){width:40vw;height:40vw;background:#12a84a;bottom:-12%;right:18%;opacity:.35;animation-duration:34s}
.aurora i:nth-child(4){width:38vw;height:38vw;background:var(--purple);bottom:-10%;left:-8%;opacity:.4;animation-duration:26s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(13,15,20,.85) 100%)}

header,main,footer{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(16px,4vw,40px)}
.mark{font-family:var(--serif);font-style:italic;font-size:30px;letter-spacing:.2px;direction:ltr;line-height:1}
.mark b{font-weight:400;color:var(--lime);text-shadow:0 0 18px rgba(142,255,1,.55)}
.mark span{color:var(--purple);text-shadow:0 0 18px rgba(139,83,254,.6)}
.mark small{font-family:var(--ar);font-style:normal;font-size:12px;color:var(--muted);letter-spacing:3px;margin-inline-start:10px;text-transform:uppercase}
.count{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;direction:ltr}
.count b{color:var(--lime);font-weight:400}
.bar{position:relative;z-index:1;height:2px;background:var(--line);margin:0 clamp(16px,4vw,40px)}
.bar i{display:block;height:100%;width:0;background:var(--lime);box-shadow:0 0 12px var(--lime);transition:width .35s ease}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px 40px}
.card{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(22px,5vw,40px);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.45);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.dr{font-size:clamp(24px,4.6vw,32px);font-weight:800;line-height:1.35;margin:0}
.en{font-family:var(--serif);font-style:italic;font-size:clamp(19px,3.4vw,23px);color:var(--muted);direction:ltr;text-align:right;margin:6px 0 0}
.help{color:var(--muted);font-size:15px;margin:14px 0 0;line-height:1.6}
.help .en-help{display:block;direction:ltr;text-align:right;font-family:var(--serif);font-style:italic;font-size:16px;opacity:.85}
.field{margin-top:26px}

/* welcome */
.welcome{text-align:center}
.welcome .hello{font-family:var(--display);font-size:clamp(40px,9vw,64px);line-height:1.25;margin:0;color:var(--text)}
.welcome .hello em{font-style:normal;color:var(--lime);text-shadow:0 0 24px rgba(142,255,1,.45)}
.welcome .big-mark{font-family:var(--serif);font-style:italic;font-size:clamp(52px,12vw,92px);direction:ltr;margin:8px 0 4px;line-height:1}
.welcome .big-mark b{font-weight:400;color:var(--lime);text-shadow:0 0 30px rgba(142,255,1,.6)}
.welcome .big-mark span{color:var(--purple);text-shadow:0 0 30px rgba(139,83,254,.7)}
.welcome .studio{letter-spacing:8px;font-size:13px;color:var(--muted);text-transform:uppercase;direction:ltr}
.welcome p.lead{font-size:18px;line-height:1.7;margin:24px auto 0;max-width:460px}
.welcome p.lead-en{font-family:var(--serif);font-style:italic;color:var(--muted);direction:ltr;font-size:19px;margin:6px auto 0;max-width:460px}
.by{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:7px 16px 7px 8px;border:1px solid var(--line);border-radius:99px;direction:ltr}
.by img{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--lime);object-fit:cover}
.by span{font-size:13px;color:var(--muted)} .by b{color:var(--lime);font-weight:700;letter-spacing:1px}

/* inputs */
input[type=text],textarea{width:100%;background:rgba(13,15,20,.7);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:16px 18px;font:500 18px var(--ar);outline:none;transition:border .2s,box-shadow .2s}
textarea{min-height:120px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(142,255,1,.15)}
.chars{font-size:12px;color:var(--muted);margin-top:6px;direction:ltr;text-align:left}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{position:relative;border:1px solid var(--line);background:rgba(13,15,20,.55);border-radius:16px;padding:16px 14px;
  cursor:pointer;text-align:center;transition:border .15s,transform .15s,background .15s;color:var(--text);font:inherit}
.opt:hover{border-color:rgba(142,255,1,.45);transform:translateY(-2px)}
.opt.on{border-color:var(--lime);background:rgba(142,255,1,.08);box-shadow:0 0 0 1px var(--lime) inset}
.opt .l1{font-weight:700;font-size:17px;display:block}
.opt .l2{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px;direction:ltr;display:block;margin-top:2px}
.opt:focus-visible,.btn:focus-visible,.toggle:focus-visible{outline:2px solid var(--lime);outline-offset:3px}

/* caption demo tiles */
.demo{height:110px;border-radius:12px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;
  background:linear-gradient(160deg,#2a2f3d,#141821);overflow:hidden;position:relative}
.demo::before{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:#3a4152;top:14px;left:50%;transform:translateX(-50%)}
.demo .cap{position:relative;font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap}
.demo .cap .w{color:var(--c-main,var(--lime))}
.demo.pop .cap .w{display:inline-block;animation:pop 1.2s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}35%{transform:scale(1)}}
.demo.box .cap{background:rgba(13,15,20,.82);padding:3px 10px;border-radius:6px;text-shadow:none}
.demo.none .cap{opacity:.25;font-weight:500}
.fontdemo{font-size:24px;font-weight:700;margin-bottom:8px;display:block}

/* toggle */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);border-radius:16px;padding:18px 20px;cursor:pointer;background:rgba(13,15,20,.55);width:100%;color:var(--text);font:inherit}
.switch{width:56px;height:32px;border-radius:99px;background:#2a3040;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s}
.toggle.on .switch{background:var(--lime)} .toggle.on .switch::after{right:28px;background:var(--ground)}
.toggle .state{font-weight:700;font-size:18px}

/* colours */
.presets{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.preset{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;background:rgba(13,15,20,.55);color:var(--text);cursor:pointer;font:600 14px var(--ar);direction:ltr}
.preset.on{border-color:var(--lime)}
.preset i{width:16px;height:16px;border-radius:50%;display:inline-block;margin-inline-end:-4px;border:2px solid var(--ground)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;background:rgba(13,15,20,.55)}
.sw input{width:100%;height:54px;border:none;border-radius:10px;background:none;cursor:pointer;padding:0}
.sw .l1{font-weight:700;font-size:15px;margin-top:8px;display:block}
.sw .l2{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;direction:ltr;display:block}
.sw code{font-size:12px;color:var(--muted);direction:ltr;display:block;margin-top:4px}
.livecap{margin-top:18px;text-align:center;font-weight:800;font-size:24px;padding:18px;border-radius:14px;background:linear-gradient(160deg,#2a2f3d,#141821)}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:32px;gap:12px}
.btn{border:none;border-radius:99px;padding:15px 30px;font:800 17px var(--ar);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn.go{background:var(--lime);color:var(--ground);box-shadow:0 8px 30px rgba(142,255,1,.25)}
.btn.go:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(142,255,1,.35)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--text)}
.btn .sub{font-family:var(--serif);font-style:italic;font-weight:400;opacity:.75;margin-inline-start:6px}
.skip{background:none;border:none;color:var(--muted);font:500 14px var(--ar);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;direction:ltr}
.hint kbd{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}

/* summary */
.sum{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px}
.sum li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(13,15,20,.5)}
.sum .k{color:var(--muted);font-size:14px}
.sum .v{font-weight:700;text-align:left;overflow-wrap:anywhere}
.sum .v i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin:0 2px}
.sum button{background:none;border:none;color:var(--lime);cursor:pointer;font:600 13px var(--ar)}
.done{text-align:center}
.done .tick{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:rgba(142,255,1,.12);border:1px solid var(--lime);color:var(--lime);font-size:38px;box-shadow:0 0 40px rgba(142,255,1,.25)}
.err{color:#ff8a8a;font-size:14px;margin-top:12px}

footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px 26px;color:var(--muted);font-size:13px;direction:ltr;flex-wrap:wrap}
footer img{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--lime);object-fit:cover}
footer b{color:var(--lime);letter-spacing:1.5px;font-weight:700}
footer .dot{opacity:.4}
@media (max-width:520px){.swatches{grid-template-columns:1fr}.btn{padding:14px 22px}.mark small{display:none}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div><div class="grain"></div>
<header>
  <div class="mark"><b>Hib</b><span>AI</span><small>Studio</small></div>
  <div class="count" id="count"></div>
</header>
<div class="bar"><i id="bar"></i></div>
<main><section class="card" id="card" aria-live="polite"></section></main>
<footer>
  <img src="assets/pfp.png" alt="" onerror="this.remove()">
  <span>HibAI Studio</span><span class="dot">·</span><span>made by Hiba</span><span class="dot">·</span><b>@HIBSSSSI</b>
</footer>

<script src="questions.js"></script>
<script>
const Q = window.HIBAI_QUESTIONS || [];
const card = document.getElementById("card");
const answers = {};
let step = -1;  // -1 welcome, 0..Q.length-1 questions, Q.length summary, Q.length+1 done

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = v => JSON.parse(JSON.stringify(v));
Q.forEach(q => answers[q.key] = clone(q.default));

function setNested(obj, key, val){
  const parts = key.split("."); let o = obj;
  parts.slice(0, -1).forEach(p => o = (o[p] = o[p] || {}));
  o[parts.at(-1)] = val;
}
function toBrief(){
  const b = {}; Q.forEach(q => setNested(b, q.key, answers[q.key])); return b;
}

function chrome(){
  const total = Q.length;
  const n = Math.min(Math.max(step + 1, 0), total);
  document.getElementById("count").innerHTML = step >= 0 && step < total ? `<b>${String(n).padStart(2,"0")}</b> / ${String(total).padStart(2,"0")}` : "";
  document.getElementById("bar").style.width = step < 0 ? "0" : Math.min(100, (step / total) * 100) + "%";
}

function nav(extra = ""){
  return `<div class="nav">
    <button class="btn go" id="next">${step === Q.length - 1 ? "شوف الملخص" : "زيد"}<span class="sub">${step === Q.length - 1 ? "review" : "next"}</span></button>
    ${extra}
    <button class="btn ghost" id="back">رجع</button>
  </div><div class="hint"><kbd>Enter</kbd> next · <kbd>Esc</kbd> back</div>`;
}

function render(){
  chrome();
  if (step < 0) return renderWelcome();
  if (step >= Q.length + 1) return renderDone();
  if (step === Q.length) return renderSummary();
  const q = Q[step];
  const head = `<h1 class="dr">${esc(q.dr.title)}</h1><p class="en">${esc(q.en.title)}</p>
    ${q.dr.help || q.en.help ? `<p class="help">${esc(q.dr.help)}<span class="en-help">${esc(q.en.help)}</span></p>` : ""}`;
  card.innerHTML = head + `<div class="field">${field(q)}</div>` + nav();
  card.style.animation = "none"; card.offsetHeight; card.style.animation = "";
  wire(q);
  document.getElementById("next").onclick = () => go(1);
  document.getElementById("back").onclick = () => go(-1);
  const first = card.querySelector("input,textarea,.opt.on,.opt,.toggle");
  if (first) first.focus({preventScroll:true});
}

function field(q){
  const v = answers[q.key];
  if (q.type === "text") return `<input type="text" id="in" maxlength="${q.max || 120}" value="${esc(v)}" placeholder="${esc(q.placeholder || "")}" dir="auto"><div class="chars" id="chars"></div>`;
  if (q.type === "longtext") return `<textarea id="in" placeholder="${esc(q.placeholder || "")}" dir="auto">${esc(v)}</textarea>`;
  if (q.type === "toggle") return `<button class="toggle ${v ? "on" : ""}" id="tg" role="switch" aria-checked="${!!v}">
      <span class="state">${v ? "إيه · Yes" : "لا · No"}</span><span class="switch"></span></button>`;
  if (q.type === "choice") return `<div class="opts" role="radiogroup">${q.options.map((o, i) => `
      <button class="opt ${o.value === v ? "on" : ""}" data-i="${i}" role="radio" aria-checked="${o.value === v}">
        ${q.look === "captions" ? captionDemo(o.demo) : ""}
        ${q.look === "fonts" ? `<span class="fontdemo" style="font-family:'${esc(o.value)}'">مرحبا HibAI</span>` : ""}
        <span class="l1">${esc(o.dr)}</span><span class="l2">${esc(o.en)}</span>
      </button>`).join("")}</div>`;
  if (q.type === "colors") return `
      <div class="presets">${q.presets.map((p, i) => `<button class="preset" data-p="${i}"><i style="background:${p.main}"></i><i style="background:${p.accent}"></i><i style="background:${p.text}"></i>${esc(p.name)}</button>`).join("")}</div>
      <div class="swatches">${q.fields.map(f => `<label class="sw"><input type="color" data-k="${f.key}" value="${esc(v[f.key])}">
        <span class="l1">${esc(f.dr)}</span><span class="l2">${esc(f.en)}</span><code>${esc(v[f.key])}</code></label>`).join("")}</div>
      <div class="livecap" id="live"></div>`;
  return "";
}

function captionDemo(kind){
  const c = (answers.colors || {}).main || "#8eff01";
  return `<div class="demo ${kind}" style="--c-main:${c}"><span class="cap">كتعلم <span class="w">AI</span> معايا</span></div>`;
}

function wire(q){
  const inp = document.getElementById("in");
  if (inp){
    const upd = () => { answers[q.key] = inp.value; const ch = document.getElementById("chars"); if (ch) ch.textContent = `${inp.value.length} / ${q.max || 120}`; };
    inp.addEventListener("input", upd); upd();
  }
  const tg = document.getElementById("tg");
  if (tg) tg.onclick = () => { answers[q.key] = !answers[q.key]; render(); };
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[q.key] = q.options[+b.dataset.i].value;
    card.querySelectorAll(".opt").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
  });
  if (q.type === "colors"){
    const live = () => {
      const c = answers[q.key];
      document.getElementById("live").innerHTML =
        `<span style="color:${c.text}">كتعلم </span><span style="color:${c.main}">AI</span><span style="color:${c.text}"> و </span><span style="color:${c.accent}">تربح</span><span style="color:${c.text}"> معايا</span>`;
      card.querySelectorAll(".preset").forEach((p, i) => {
        const s = q.presets[i]; p.classList.toggle("on", s.main === c.main && s.accent === c.accent && s.text === c.text);
      });
    };
    card.querySelectorAll(".sw input").forEach(inp => inp.addEventListener("input", () => {
      answers[q.key][inp.dataset.k] = inp.value; inp.parentElement.querySelector("code").textContent = inp.value; live();
    }));
    card.querySelectorAll(".preset").forEach(p => p.onclick = () => {
      const s = q.presets[+p.dataset.p]; answers[q.key] = {main: s.main, accent: s.accent, text: s.text}; render();
    });
    live();
  }
}

function renderWelcome(){
  card.innerHTML = `<div class="welcome">
    <h1 class="hello">مرحبا <em>بيك</em></h1>
    <div class="big-mark"><b>Hib</b><span>AI</span></div>
    <div class="studio">Studio</div>
    <p class="lead">جاوب على شي أسئلة صغار، وأنا نقاد ليك الفيديو: نقطع السكتات، نكتب الكابشن بالكلمة، ونلبسو ألوان HibAI.</p>
    <p class="lead-en">Answer a few quick questions and I'll edit your video: pauses cut, word-by-word captions, dressed in HibAI colours.</p>
    <div class="nav" style="justify-content:center"><button class="btn go" id="next">يلاه نبداو<span class="sub">let's go</span></button></div>
    <div class="by"><img src="assets/pfp.png" alt="" onerror="this.remove()"><span>Welcome to the HibAI community · by</span><b>@hibssssi</b></div>
  </div>`;
  document.getElementById("next").onclick = () => go(1);
  document.getElementById("next").focus();
}

function pretty(q){
  const v = answers[q.key];
  if (q.type === "toggle") return v ? "إيه · Yes" : "لا · No";
  if (q.type === "choice"){ const o = q.options.find(o => o.value === v); return o ? `${esc(o.dr)} · <i style="font-family:var(--serif);color:var(--muted);width:auto;height:auto">${esc(o.en)}</i>` : esc(v); }
  if (q.type === "colors") return q.fields.map(f => `<i style="background:${v[f.key]}"></i>`).join("");
  return v ? esc(v) : `<span style="color:var(--muted);font-weight:400">—</span>`;
}

function renderSummary(){
  card.innerHTML = `<h1 class="dr">هادشي اللي اخترتي</h1><p class="en">Here's your brief</p>
    <ul class="sum">${Q.map((q, i) => `<li><div><div class="k">${esc(q.dr.title)}</div><div class="v">${pretty(q)}</div></div><button data-i="${i}">بدّل</button></li>`).join("")}</ul>
    <div class="nav"><button class="btn go" id="save">صافي، سجّل<span class="sub">save</span></button><button class="btn ghost" id="back">رجع</button></div>
    <div class="err" id="err"></div>`;
  card.querySelectorAll(".sum button").forEach(b => b.onclick = () => { step = +b.dataset.i; render(); });
  document.getElementById("back").onclick = () => go(-1);
  document.getElementById("save").onclick = save;
}

async function save(){
  const brief = toBrief();
  brief.saved_at = new Date().toISOString();
  try {
    const r = await fetch("api/brief", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(brief)});
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    // Opened as a plain file (no Claude server): hand the brief over as a download instead.
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(brief, null, 1)], {type: "application/json"}));
    a.download = "brief.json"; a.click();
  }
  step = Q.length + 1; render();
}

function renderDone(){
  card.innerHTML = `<div class="done"><div class="tick">✓</div>
    <h1 class="dr">تسجّل!</h1><p class="en" style="text-align:center">Saved, you're all set</p>
    <p class="help" style="text-align:center">رجع لـ Claude — غادي يبدا يقاد الفيديو دابا.<span class="en-help" style="text-align:center">Head back to Claude, the edit starts now. You can close this tab.</span></p></div>`;
  document.getElementById("bar").style.width = "100%";
}

function go(d){
  step = Math.max(-1, Math.min(Q.length + 1, step + d));
  render();
}

document.addEventListener("keydown", e => {
  if (step >= Q.length) return;
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA" && !e.target.classList.contains("opt") && !e.target.classList.contains("preset")) { e.preventDefault(); go(1); }
  if (e.key === "Escape" && step >= 0) go(-1);
});

// Pre-fill from an earlier brief when Claude's local server is running.
fetch("api/brief").then(r => r.ok ? r.json() : null).then(b => {
  if (!b) return;
  Q.forEach(q => {
    const v = q.key.split(".").reduce((o, k) => o && o[k], b);
    if (v !== undefined) answers[q.key] = q.type === "colors" ? Object.assign(clone(q.default), v) : v;
  });
}).catch(() => {}).finally(render);
</script>
</body>
